<section id="portfolioChatbot" class="portfolio-chatbot" style="position:fixed;right:20px;left:auto;bottom:78px;top:auto;z-index:1001" aria-label="Portfolio chatbot">
  <button id="chatbotLauncher" class="chatbot-launcher" type="button" aria-expanded="false" aria-controls="chatbotPanel" aria-label="Open portfolio assistant"><span class="chatbot-launcher-icon" aria-hidden="true">✦</span><span>Ask Ayaz</span></button>
  <div id="chatbotPanel" class="chatbot-panel" hidden>
    <div class="chatbot-header"><div class="chatbot-header-info"><span class="chatbot-status-dot" aria-hidden="true"></span><div><strong>Ayaz's Portfolio Assistant</strong><small>Portfolio &amp; career assistant</small></div></div><button id="chatbotClose" class="chatbot-close" type="button" aria-label="Close assistant">×</button></div>
    <div id="chatbotMessages" class="chatbot-messages" aria-live="polite"></div>
    <div id="chatbotSuggestions" class="chatbot-suggestions"></div>
    <div id="chatbotTyping" class="chatbot-typing" hidden><span></span><span></span><span></span> <small>Thinking…</small></div>
    <form id="chatbotForm" class="chatbot-form"><input id="chatbotInput" name="question" type="text" autocomplete="off" placeholder="Ask about Ayaz..." aria-label="Ask the portfolio assistant" maxlength="240" required><button class="chatbot-send" type="submit" aria-label="Send question">↑</button></form>
  </div>
</section>
