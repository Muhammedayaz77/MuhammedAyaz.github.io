<section id="portfolioChatbot" class="portfolio-chatbot" aria-label="Portfolio chatbot"><button id="chatbotLauncher" class="chatbot-launcher" type="button" aria-expanded="false" aria-controls="chatbotPanel" aria-label="Open portfolio assistant"><span class="chatbot-launcher-icon" aria-hidden="true">✦</span><span>Ask Ayaz</span></button><div id="chatbotPanel" class="chatbot-panel" hidden><div class="chatbot-header"><div><span class="chatbot-status-dot" aria-hidden="true"></span><strong>Ayaz's Portfolio Assistant</strong><small>Ask about iOS, experience, projects or skills</small></div><button id="chatbotClose" class="chatbot-close" type="button" aria-label="Close assistant">×</button></div><div id="chatbotMessages" class="chatbot-messages" aria-live="polite"></div><div id="chatbotSuggestions" class="chatbot-suggestions"></div><form id="chatbotForm" class="chatbot-form"><input id="chatbotInput" name="question" type="text" autocomplete="off" placeholder="Ask me something..." aria-label="Ask the portfolio assistant" maxlength="240" required><button class="chatbot-send" type="submit" aria-label="Send question">↑</button></form></div></section>
