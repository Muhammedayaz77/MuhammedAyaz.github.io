name: Normalize Blog Pages

on:
  push:
    branches:
      - main
      - website-updates

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Normalize blog pages
        run: python Helper/normalize_blog.py

      - name: Commit normalized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "View/Blog"
          if git diff --cached --quiet; then
            echo "No blog normalization changes needed."
          else
            git commit -m "chore: normalize blog pages"
            git push
          fi
